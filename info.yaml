# info.yaml
# GDS 2.5D view konfiguráció - Piros 'X' alakzat példa

meta:
  version: "1.0"
  description: "Piros X alakzat GDS rétegkiosztás és 2.5D vizualizációs beállítás"

layers:
  - layer_number: 10
    datatype: 0
    name: "X_SHAPE"
    color: "#FF0000"          # Piros szín kódja
    alpha: 0.8                # Átlátszóság (0.0 - 1.0)
    thickness: 1.5            # 2.5D magasság / vastagság mikronban (um)
    z_start: 0.0              # Alap magassági szint (Z-tengely)

view_settings:
  dimension: "2.5D"
  background_color: "#FFFFFF"
  camera:
    fov: 45
    default_angle: [30, 45, 0]


# Do not change!
yaml_version: 6
