# GDS 2.5D Megjelenítési Konfiguráció
version: "1.0"

# Ügyelj rá, hogy a GDS fájl pontosan ezen a néven fusson az info.yaml mellett!
design:
  gds_file: "design.gds"
  cell_name: "TOP"       # Cseréld ki a saját fő cellád nevére, ha nem TOP

# A 2.5D view réteg- és magassági beállításai (Piros X elkerülésére)
layers:
  - layer: 1
    datatype: 0
    name: "Red_Layer_1"
    color: "#FF0000"     # Piros szín
    z_start: 0.0         # Alapmagasság (mikronban)
    thickness: 0.5       # Vastagság a 2.5D nézethez

  - layer: 2
    datatype: 0
    name: "Red_Layer_2"
    color: "#FF0000"     # Szintén piros
    z_start: 0.5
    thickness: 1.0

  - layer: 3
    datatype: 0
    name: "Red_Layer_3"
    color: "#FF0000"
    z_start: 1.5
    thickness: 0.8

# Do not change!
yaml_version: 6
